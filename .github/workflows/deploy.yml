name: Deploy EvidenCite AWS EC2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DEPLOY_EVIDENCITE para crear/reutilizar EC2 (genera costos)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evidencite-ec2-lifecycle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
      EVIDENCITE_DEPLOY_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Confirmar despliegue
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = 'DEPLOY_EVIDENCITE' || { echo 'Confirmacion invalida'; exit 2; }
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: AWS Academy preflight (solo lectura)
        run: python3 tools/aws_academy_preflight.py
      - name: Verificar bucket de modelos persistentes
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "evidencite-demo-${ACCOUNT}-models"
      - name: Crear o reutilizar EC2, desplegar via SSM y comprobar HTTPS
        run: bash tools/academy_rebuild.sh --approve-costs

      - name: Publicar URL de EvidenCite
        if: always()
        shell: bash
        run: |
          URL="$(terraform -chdir=infra/evidencite output -raw public_url 2>/dev/null || true)"
          if [[ "$URL" =~ ^https://evidencite\.[0-9-]+\.sslip\.io$ ]]; then
            {
              echo "## 🚀 EvidenCite — URL pública"
              echo ""
              echo "**[Abrir aplicación]($URL)**"
              echo ""
              echo "Si el despliegue falló, verifica el estado de la aplicación."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=URL de EvidenCite::$URL"
          else
            echo "No hay URL pública disponible en Terraform." >> "$GITHUB_STEP_SUMMARY"
          fi
