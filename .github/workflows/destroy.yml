name: Destroy EvidenCite AWS EC2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY_EVIDENCITE (elimina EC2/EBS, preserva S3/SSM)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evidencite-ec2-lifecycle
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
    steps:
      - name: Confirmar destruccion
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = 'DESTROY_EVIDENCITE' || { echo 'Confirmacion invalida'; exit 2; }
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Inicializar el estado remoto YA EXISTENTE
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          STATE_BUCKET="evidencite-tfstate-${ACCOUNT}"
          aws s3api head-bucket --bucket "$STATE_BUCKET"
          terraform -chdir=infra/evidencite init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config='key=evidencite/ec2-demo.tfstate' \
            -backend-config='region=us-east-1' \
            -backend-config='use_lockfile=true'
      - name: Proteger los recursos S3 persistentes
        run: |
          if terraform -chdir=infra/evidencite state list | grep -E '(^|\\.)(aws_s3_bucket|aws_ssm_parameter)'; then
            echo 'STOP: el estado incluye recursos persistentes S3 o SSM; revisar antes de destruir' >&2
            exit 2
          fi
      - name: Destruir solamente el stack EC2
        run: terraform -chdir=infra/evidencite destroy -input=false -auto-approve -var='allow_paid_resources=true'
      - name: Resumen
        run: echo 'Stack EC2 destruido; buckets de modelos y estado no administrados por este stack.' >> "$GITHUB_STEP_SUMMARY"
