name: Validate EvidenCite AWS

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'infra/evidencite/**'
      - 'compose.aws.yaml'
      - 'api/Dockerfile.granite'
      - 'api/workers/granite_service.py'
      - 'tools/download_granite_base.py'
      - 'tools/download_granite_base.sh'
      - 'tools/upload_granite_adapters_s3.sh'
      - 'api/Dockerfile.academy'
      - 'tools/aws_academy_preflight.py'
      - 'tools/upload_academy_models_s3.sh'
      - 'tools/ec2_academy_deploy.sh'
      - 'tools/prepare_ssm_deploy.py'
      - 'tools/academy_rebuild.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/destroy.yml'
      - '.github/workflows/validate.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'infra/evidencite/**'
      - 'compose.aws.yaml'
      - 'api/Dockerfile.granite'
      - 'api/workers/granite_service.py'
      - 'tools/download_granite_base.py'
      - 'tools/download_granite_base.sh'
      - 'tools/upload_granite_adapters_s3.sh'
      - 'api/Dockerfile.academy'
      - 'tools/aws_academy_preflight.py'
      - 'tools/upload_academy_models_s3.sh'
      - 'tools/ec2_academy_deploy.sh'
      - 'tools/prepare_ssm_deploy.py'
      - 'tools/academy_rebuild.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/destroy.yml'
      - '.github/workflows/validate.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Terraform format
        run: terraform -chdir=infra/evidencite fmt -check -recursive
      - name: Init providers without state or AWS credentials
        run: terraform -chdir=infra/evidencite init -backend=false -input=false -no-color
      - name: Validate Terraform
        run: terraform -chdir=infra/evidencite validate -no-color
      - name: Validate Compose cloud (no containers)
        env:
          GEMINI_API_KEY: placeholder-for-syntax-only
          EVIDENCITE_DOMAIN: evidencite.example.com
        run: docker compose -f compose.aws.yaml config --quiet
      - name: Python and Shell syntax
        run: |
          python3 -m py_compile tools/aws_academy_preflight.py tools/prepare_ssm_deploy.py
          python3 -m py_compile tools/download_granite_base.py api/workers/granite_service.py
          bash -n tools/upload_academy_models_s3.sh tools/ec2_academy_deploy.sh tools/academy_rebuild.sh infra/evidencite/bootstrap.sh tools/download_granite_base.sh tools/upload_granite_adapters_s3.sh

      - name: Validate frontend JavaScript syntax
        run: find app/static -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
