# REFERENCE ONLY: previous single-host Granite 22-GiB prototype; NOT deployed to AWS Academy.
# Use only on EC2 with /srv/evidencite/models populated from private S3.
# Local compose.yaml is not modified.
name: evidencite-cloud
services:
  granite:
    image: evidencite-api:cloud
    build:
      context: .
      dockerfile: api/Dockerfile.cloud
    entrypoint: ["uvicorn"]
    command: ["api.workers.granite_service:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      HF_HUB_OFFLINE: "1"
      GRANITE_BASE_PATH: /models/base
      GRANITE_A_PATH: /models/a
      GRANITE_B_PATH: /models/b
    volumes:
      - /srv/evidencite/models/granite_base:/models/base:ro
      - /srv/evidencite/models/granite_A:/models/a:ro
      - /srv/evidencite/models/granite_B:/models/b:ro
    mem_limit: 22g
    memswap_limit: 24g
    cpus: 8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 900s
    restart: unless-stopped

  api:
    image: evidencite-api:cloud
    build:
      context: .
      dockerfile: api/Dockerfile.cloud
    environment:
      ENABLE_DEMO_MODEL: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in /srv/evidencite/secrets/.env}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GRANITE_URL: http://granite:8001
      EVIDENCITE_METRICS_DB: /workspace/var/metrics.sqlite3
      EVIDENCITE_TFIDF_ROOT: /opt/evidencite-models
      EVIDENCITE_SCIBERT_A_PATH: /opt/evidencite-models/scibert_A
      EVIDENCITE_SCIBERT_B_PATH: /opt/evidencite-models/scibert_B
      HF_HOME: /root/.cache/huggingface
    volumes:
      - /srv/evidencite/models/tfidf_A:/opt/evidencite-models/tfidf_A:ro
      - /srv/evidencite/models/tfidf_B:/opt/evidencite-models/tfidf_B:ro
      - /srv/evidencite/models/scibert_A:/opt/evidencite-models/scibert_A:ro
      - /srv/evidencite/models/scibert_B:/opt/evidencite-models/scibert_B:ro
      - /srv/evidencite/metrics:/workspace/var
      - hf-cache:/root/.cache/huggingface
    depends_on:
      granite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  app:
    build:
      context: ./app
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80" # only visible through SSM port forwarding
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  hf-cache:
