# Línea base clásica: TF-IDF + LogisticRegression balanceada
experiment_name: "baseline_tfidf_config_a"
model_family: "tfidf"
seed: 42

input_representation:
  configuration: "A"
  include_citing_section: true
  include_cited_section: true
  max_seq_length: 512
  enforce_per_chunk_budget: true
  top_k_chunks: 3
  strip_cite_tags: true

tfidf:
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.95
  max_features: 50000
  sublinear_tf: true
  c_penalty: 1.0
  class_weight: "balanced"
  max_iter: 1000

