# Configuración del Panel de Jueces para Pre-etiquetado Asistido (Actividad A2)
# Documento de Diseño: documentacion/diseno-tecnico/13-diseno-labeling-panel-jueces.md
# Ejecución: python -m src.labeling.judge_panel --config configs/labeling.yaml [--limit 50] [--judges llama31_8b]
# Decisiones Relacionadas: ADR-08 (Ciclo de Vida de Etiqueta), ADR-09 (Particionamiento Anti-Fuga), ADR-10 (Taxonomía Canónica)

input_path: "data/dataset/instances.jsonl"
output_dir: "data/labeled"
log_path: "data/logs/labeling.log"
seed: 42

aggregation:
  min_agreement: 0.66          # Mayoría calificada requerida (2 de 3 votos)
  quota_per_class: 2000        # Meta balanceada de cuota para auditoría de métricas de dataset

# ==============================================================================
# PERFIL 1: HOSTED (Por defecto para corrida completa de 18.658 instancias)
# Utiliza APIs de pesos abiertos bajo contrato OpenAI (OpenRouter / Groq / Together)
# ==============================================================================
judges:
  - id: "llama31_8b"
    provider: "openrouter"
    model_name: "meta-llama/llama-3.1-8b-instruct"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    temperature: 0.0
    max_output_tokens: 150
    max_retries: 3
    timeout_seconds: 60.0
    max_concurrency: 8

  - id: "qwen25_7b"
    provider: "openrouter"
    model_name: "qwen/qwen-2.5-7b-instruct"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    temperature: 0.0
    max_output_tokens: 150
    max_retries: 3
    timeout_seconds: 60.0
    max_concurrency: 8

  - id: "mistral_7b"
    provider: "openrouter"
    model_name: "mistralai/mistral-7b-instruct-v0.3"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    temperature: 0.0
    max_output_tokens: 150
    max_retries: 3
    timeout_seconds: 60.0
    max_concurrency: 8

