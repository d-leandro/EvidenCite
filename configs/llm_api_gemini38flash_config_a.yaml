# Actividad A5 — LLM Eficiente de Frontera vía API (Google Gemini 3.8 Flash · Configuración A: Título + Abstract)
experiment_name: "llm_api_gemini38flash_config_a"
model_family: "llm_api"

paths:
  mlflow_experiment_name: "EvidenCite_A5_LLM_API"

input_representation:
  configuration: "A"
  include_citing_section: false
  include_cited_section: true
  max_seq_length: 512
  enforce_per_chunk_budget: true
  top_k_chunks: 3
  strip_cite_tags: false

llm_api:
  provider: "gemini"
  model_name: "gemini-3.8-flash"
  api_key_env: "GEMINI_API_KEY"
  base_url: null
  temperature: null
  seed: 42
  max_output_tokens: 2048
  thinking_budget: null
  thinking_level: "LOW"
  prompt_mode: "generic"
  num_few_shot: 0
  shot_variants:
    - 0
    - 9
  enforce_structured_output: true
  cache_path: "models/llm_api_cache/gemini38flash_config_a.jsonl"
  cost_per_1m_input_tokens_usd: 0.75
  cost_per_1m_cached_input_tokens_usd: 0.075
  cost_per_1m_output_tokens_usd: 3.75
  max_retries: 3
  timeout_seconds: 60.0

