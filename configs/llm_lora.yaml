# Extensión A4/A5 — LLM Liviano de Pesos Abiertos Fine-Tuned con PEFT/LoRA (SEQ_CLS)
experiment_name: "llm_lora_config_b"
model_family: "llm_lora"
seed: 42
device: "auto"

input_representation:
  configuration: "B"
  include_citing_section: true
  include_cited_section: true
  max_seq_length: 512
  enforce_per_chunk_budget: true
  top_k_chunks: 3
  strip_cite_tags: false

llm_lora:
  pretrained_model_name_or_path: "HuggingFaceTB/SmolLM2-135M"
  task_type: "SEQ_CLS"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  modules_to_save:
    - "score"
    - "classifier"
  bias: "none"
  learning_rate: 1.0e-4
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  num_train_epochs: 5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  loss_type: "weighted_ce"
  class_weight_scheme: "balanced"
  focal_gamma: 2.0
  early_stopping_patience: 2
  dynamic_padding: true
  fp16: false
  bf16: false

