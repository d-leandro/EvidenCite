server {
    listen 80;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://app:80;
    }
}
