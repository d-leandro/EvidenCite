# Rate-limit inference per real visitor IP (Caddy is the only public entry point).
# Caddy overwrites inbound X-Forwarded-For by default; trust Docker bridge only.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=evidencite_predict:10m rate=6r/m;

server {
    listen 80;
    limit_req_status 429;
    location = /api/v1/predict {
        limit_req zone=evidencite_predict burst=6 nodelay;
        proxy_pass http://api:8000;
        # CPU Granite can take several minutes; Cloudflare worker itself is polled asynchronously.
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://app:80;
    }
}
