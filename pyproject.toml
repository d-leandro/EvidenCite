[project]
name = "evidencite"
version = "0.1.0"
description = "Local Citation Recommendation and Rhetorical Function Classification in Scientific Literature via Dense Evidence Retrieval and Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.142.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]
