[project]
name = "evidencite"
version = "0.1.0"
description = "Local Citation Recommendation and Rhetorical Function Classification in Scientific Literature via Dense Evidence Retrieval and Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "bitsandbytes>=0.50.2",
    "docling>=2.142.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.18.0",
    "numpy>=2.4.6",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "peft>=0.21.2",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "torchao>=0.16",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "dvc[gdrive]>=3.67.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]
