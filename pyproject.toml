[project]
name = "evidencite"
version = "0.1.0"
description = "Local Citation Recommendation and Rhetorical Function Classification in Scientific Literature via Dense Evidence Retrieval and Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "peft>=0.21.2",
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "mlflow-skinny>=3.17.2",
    "scikit-learn>=1.9.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]
